name: iOS App Store Upload

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Download IPA from successful release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          RUN_ID="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-release.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id')"

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful iOS release run found"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ipa"
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name VedettUtvonal-AppStore-IPA \
            --dir "$RUNNER_TEMP/ipa"

          IPA_PATH="$(find "$RUNNER_TEMP/ipa" -name '*.ipa' -type f -print -quit)"
          test -n "$IPA_PATH"

          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Using IPA from release run $RUN_ID"

      - name: Install App Store Connect API key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077

          test -n "$APPSTORE_API_PRIVATE_KEY"
          test -n "$APPSTORE_API_KEY_ID"
          test -n "$APPSTORE_ISSUER_ID"

          mkdir -p "$HOME/.appstoreconnect/private_keys"

          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APPSTORE_API_KEY_ID}.p8"

          printf '%s\n' "$APPSTORE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"

          echo "APPSTORE_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Upload IPA to App Store Connect
        env:
          APPSTORE_API_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APPSTORE_API_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Cleanup API key
        if: always()
        run: |
          if [ -n "${APPSTORE_KEY_PATH:-}" ]; then
            rm -f "$APPSTORE_KEY_PATH"
          fi