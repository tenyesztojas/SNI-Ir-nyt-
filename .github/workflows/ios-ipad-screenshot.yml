name: iPad Screenshot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: vedett-utvonal-native

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vedett-utvonal-native/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Sync iOS
        run: npx cap sync ios

      - name: Build simulator app
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Boot 13-inch iPad
        run: |
          xcrun simctl boot "iPad Pro 13-inch (M5)"
          xcrun simctl bootstatus "iPad Pro 13-inch (M5)" -b

      - name: Install and launch app
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/App.app"
          xcrun simctl install booted "$APP_PATH"
          xcrun simctl status_bar booted override \
            --time "9:41" \
            --dataNetwork wifi \
            --wifiMode active \
            --wifiBars 3 \
            --batteryState charged \
            --batteryLevel 100
          xcrun simctl launch booted hu.vedettsarok.utvonal
          sleep 25

      - name: Capture screenshot
        run: |
          mkdir -p screenshots
          xcrun simctl io booted screenshot screenshots/vedett-utvonal-ipad-13.png
          sips -g pixelWidth -g pixelHeight screenshots/vedett-utvonal-ipad-13.png

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: vedett-utvonal-ipad-13
          path: vedett-utvonal-native/screenshots/vedett-utvonal-ipad-13.png
          retention-days: 7
